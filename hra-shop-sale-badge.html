<style>
[data-hra-discount-loading] .hra-discount-dots {
  display: flex;
  gap: 3px;
}

.hra-discount-dots > i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  animation: hra-discount-wave 900ms ease-in-out infinite;
}

.hra-discount-dots > i:nth-child(2) {
  animation-delay: 110ms;
}

.hra-discount-dots > i:nth-child(3) {
  animation-delay: 220ms;
}

@keyframes hra-discount-wave {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-4px); }
}

@media (prefers-reduced-motion: reduce) {
  .hra-discount-dots > i { animation: none; }
}
</style>
<script>
(() => {
  if (window.hraDiscountStickersActive) return;
  window.hraDiscountStickersActive = true;

  const cards = '.ht-product, .woocommerce ul.products li.product';
  const priceSelector = '.ht-product-price, .price';

  const variantDiscounts = new Map();

  function discountPercent(regular, current) {
    return regular > current && current >= 0
      ? Math.round((regular - current) / regular * 100)
      : 0;
  }

  async function fetchProducts(params) {
    const apiRoot = document.querySelector('link[rel="https://api.w.org/"]')?.href ||
      new URL('/wp-json/', location.origin).href;
    const endpoint = new URL(apiRoot);
    if (endpoint.searchParams.has('rest_route')) {
      endpoint.searchParams.set('rest_route', '/wc/store/v1/products');
    } else {
      endpoint.pathname = endpoint.pathname.replace(/\/?$/, '/') + 'wc/store/v1/products';
    }
    for (const [key, value] of Object.entries(params)) endpoint.searchParams.set(key, value);

    const response = await fetch(endpoint, { signal: AbortSignal.timeout(5000) });
    if (!response.ok) throw new Error('WooCommerce product prices unavailable');
    return {
      products: await response.json(),
      pages: Number(response.headers.get('X-WP-TotalPages')) || 1
    };
  }

  async function highestVariantDiscount(productId, slug) {
    if (!productId) {
      const { products } = await fetchProducts({ slug, _fields: 'id,type' });
      productId = products.find(item => item.type === 'variable')?.id;
    }
    if (!productId) return 0;

    let highest = 0;
    let page = 1;
    let pages;
    do {
      const result = await fetchProducts({
        type: 'variation',
        parent: productId,
        stock_status: 'instock,onbackorder',
        per_page: 100,
        page,
        _fields: 'prices,on_sale,is_purchasable'
      });
      for (const variant of result.products) {
        const { regular_price, price } = variant.prices || {};
        if (variant.on_sale && variant.is_purchasable && regular_price && price) {
          highest = Math.max(highest, discountPercent(Number(regular_price), Number(price)));
        }
      }
      pages = result.pages;
      page += 1;
    } while (page <= pages);
    return highest;
  }

  function variantDiscountForCard(card) {
    const link = card.querySelector('.ht-product-title a, a.woocommerce-LoopProduct-link, .ht-product-image a');
    if (!link) return 0;
    const url = new URL(link.href, location.href);
    if (url.origin !== location.origin) return 0;
    const slug = url.pathname.split('/').filter(Boolean).pop();
    if (!slug) return 0;

    const productId = card.className.match(/\bpost-(\d+)\b/)?.[1] ||
      card.querySelector('.add_to_cart_button[data-product_id]')?.dataset.product_id;
    if (!variantDiscounts.has(slug)) {
      variantDiscounts.set(slug, { percent: 0, waiting: new Set() });
      highestVariantDiscount(productId, slug).catch(() => 0).then(percent => {
        const result = variantDiscounts.get(slug);
        result.percent = percent;
        const waiting = result.waiting;
        result.waiting = null;
        for (const waitingCard of waiting) {
          if (waitingCard.isConnected) updateCard(waitingCard);
        }
      });
    }

    const result = variantDiscounts.get(slug);
    result.waiting?.add(card);
    return result.waiting ? null : result.percent;
  }

  function readPrice(node) {
    const amounts = node?.querySelectorAll('.woocommerce-Price-amount');
    if (amounts?.length !== 1) return NaN;

    const amount = amounts[0].textContent.replace(/[^\d.,]/g, '');
    // The shop displays prices with two decimals.
    if (!/^\d[\d.,]*[.,]\d{2}$/.test(amount)) return NaN;
    return Number(amount.slice(0, -3).replace(/[.,]/g, '') + '.' + amount.slice(-2));
  }

  function updateCard(card) {
    const price = card.querySelector(priceSelector);
    const regular = readPrice(price?.querySelector('del'));
    const sale = readPrice(price?.querySelector('ins'));
    const sticker = card.querySelector('.hra-discount-sticker');
    const isSaleLabel = text => /^(sale|aanbieding|korting)!?$/i.test(text.trim());
    const existingBadge = card.querySelector('.onsale') ||
      [...card.querySelectorAll('.ht-product-label span, span.ht-product-label')]
        .find(label => isSaleLabel(label.textContent));
    const hasSaleLabel = existingBadge || isSaleLabel(sticker?.dataset.hraOriginalLabel || '');

    const hasPricePair = Number.isFinite(regular) && Number.isFinite(sale);
    const hasStartingPrice = /^(vanaf|from)\b/i.test(price?.textContent.trim() || '');
    const hasVariantPrices = hasStartingPrice || card.classList.contains('product-type-variable');
    const percent = hasSaleLabel && (hasVariantPrices || !hasPricePair)
      ? variantDiscountForCard(card)
      : discountPercent(regular, sale);

    if (percent !== null && percent <= 0) {
      if (sticker?.dataset.hraGenerated === 'true') {
        sticker.remove();
      } else if (sticker) {
        sticker.textContent = sticker.dataset.hraOriginalLabel;
        sticker.removeAttribute('aria-label');
        sticker.removeAttribute('data-hra-discount-loading');
        sticker.classList.remove('hra-discount-sticker');
      }
      return;
    }

    const badge = sticker || existingBadge || document.createElement('span');
    if (!sticker) {
      badge.dataset.hraOriginalLabel = badge.textContent;
      badge.classList.add('hra-discount-sticker');
      if (!existingBadge) {
        badge.dataset.hraGenerated = 'true';
        (card.querySelector('.ht-product-image-wrap') || card).prepend(badge);
      }
    }

    if (percent === null) {
      if (!badge.hasAttribute('data-hra-discount-loading')) {
        const dots = document.createElement('i');
        dots.className = 'hra-discount-dots';
        dots.setAttribute('aria-hidden', 'true');
        dots.append(...Array.from({ length: 3 }, () => document.createElement('i')));
        badge.replaceChildren(dots);
        badge.setAttribute('data-hra-discount-loading', '');
        badge.setAttribute('aria-label', 'Korting wordt geladen');
      }
      return;
    }

    badge.removeAttribute('data-hra-discount-loading');
    const label = `-${percent}%`;
    if (badge.textContent !== label) {
      badge.textContent = label;
      badge.setAttribute('aria-label', `${percent}% korting`);
    }
  }

  function start() {
    document.querySelectorAll(cards).forEach(updateCard);

    const observer = new MutationObserver(records => {
      const changedCards = new Set();
      for (const record of records) {
        const target = record.target instanceof Element
          ? record.target
          : record.target.parentElement;
        const price = target?.closest(priceSelector);
        const priceCard = price?.closest(cards);
        if (priceCard) changedCards.add(priceCard);
        for (const node of record.addedNodes) {
          if (!(node instanceof Element)) continue;
          if (node.matches(cards)) changedCards.add(node);
          node.querySelectorAll(cards).forEach(addedCard => changedCards.add(addedCard));

          if (node.matches(priceSelector) || node.querySelector(priceSelector)) {
            const card = node.closest(cards);
            if (card) changedCards.add(card);
          }
        }
      }
      changedCards.forEach(updateCard);
    });

    observer.observe(document.querySelector('#content') || document.body, {
      childList: true,
      characterData: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading' && !document.querySelector(cards)) {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
